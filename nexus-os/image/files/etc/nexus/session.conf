# Configuration de la session « NEXUS » (lue par /usr/libexec/nexus/nexus-session).
# Copiez ce fichier dans ~/.config/nexus/session.conf pour le surcharger.

# Client d'affichage : auto | webkit | firefox
#   webkit  : vue WebKitGTK intégrée à l'image (hors ligne, versionnée avec NEXUS)
#   firefox : Firefox Flatpak (org.mozilla.firefox) en mode --kiosk
#   auto    : webkit si disponible, sinon firefox
NEXUS_KIOSK=auto

# Arguments gamescope. -f : plein écran. Ajoutez par ex. "-W 1920 -H 1080 -r 60".
# "-e" (mode Steam) n'est pas activé par défaut : il délègue le focus des fenêtres
# à l'interface Steam Big Picture, qui n'est pas la coque dans la session NEXUS.
NEXUS_GAMESCOPE_ARGS="-f"

# Démarrer Steam en arrière-plan (-silent) pour que steam://rungameid fonctionne.
NEXUS_START_STEAM=1
