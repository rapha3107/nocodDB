[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-os"
version = "0.1.0"
description = "NEXUS OS userspace: NEXUS Home backend, NEXUS AI and system modules"
requires-python = ">=3.11"
dependencies = []  # core is stdlib-only on purpose (ships in an atomic image)

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nexusd = "nexus.api.server:main"
nexusctl = "nexus.cli:main"

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
